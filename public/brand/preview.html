<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Cadenzia mark preview</title>
<style>
  body { margin:0; background:#002233; font-family:sans-serif; padding:40px; display:flex; flex-direction:column; gap:40px; }
  .row { display:flex; gap:32px; align-items:center; }
  .label { color:#5a6b74; font-size:11px; margin-top:8px; text-align:center; }
  .box { display:flex; flex-direction:column; align-items:center; }
  svg { color:#DDFF55; }
</style>
</head>
<body>
  <div class="row">
    <div class="box"><img src="mark.svg" width="200" height="200" style="filter:none"/><div class="label">mark.svg (200px)</div></div>
    <div class="box"><img src="mark.svg" width="48" height="48" style="filter:none"/><div class="label">48px</div></div>
    <div class="box"><img src="mark.svg" width="24" height="24" style="filter:none"/><div class="label">24px</div></div>
  </div>
  <div class="row">
    <div class="box"><img src="mark-icon.svg" width="200" height="200"/><div class="label">mark-icon.svg (200px)</div></div>
    <div class="box"><img src="mark-icon.svg" width="48" height="48"/><div class="label">48px</div></div>
    <div class="box"><img src="mark-icon.svg" width="24" height="24"/><div class="label">24px</div></div>
  </div>
  <div class="row">
    <div class="box"><img src="wordmark.svg" width="400" height="143"/><div class="label">wordmark.svg (400px)</div></div>
  </div>
  <div class="row" style="background:#F6F2E8;padding:24px;border-radius:12px">
    <div class="box"><img src="mark.svg" width="32" height="32" style="filter:invert(1) sepia(1) saturate(5) hue-rotate(30deg) brightness(0.3)"/>
    <div class="label" style="color:#5a6b74">mark on light (needs CSS color)</div></div>
  </div>
</body></html>
